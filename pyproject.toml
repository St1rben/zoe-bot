[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoe-bot"
description = "Telegram-бот, що стежить за графіками відключень електроенергії на zoe.com.ua"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "aiogram==3.18.0",
    "aiohttp==3.11.11",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "pydantic-settings==2.16.0",
    "tzdata==2026.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]

[tool.setuptools]
packages = ["zoe_bot"]

[tool.setuptools.dynamic]
version = { attr = "zoe_bot.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
