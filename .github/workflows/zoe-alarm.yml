name: zoe-alarm

# Моніторинг планових та аварійних відключень за адресами з каналу https://t.me/zoe_alarm.
# Повністю ізольований від zoe-fetch.yml (ГПВ) і не потребує Tor.
#
# Секрети репозиторію (Settings → Secrets and variables → Actions):
#   INGEST_TOKEN      — спільний токен воркера (вже налаштований)
#   TELEGRAM_API_ID   — API ID з https://my.telegram.org (для завантаження .xlsx)
#   TELEGRAM_API_HASH — API Hash з https://my.telegram.org
#   TELEGRAM_SESSION  — StringSession (генерується один раз через cloudflare/scripts/gen-tg-session.py)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zoe-alarm
  cancel-in-progress: false

jobs:
  sync-alarm:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      WORKER_URL: "https://zoe-outage-bot.kir245314.workers.dev"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Швидка перевірка t.me/s/zoe_alarm (без авторизації)
        id: check
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          python3 cloudflare/scripts/sync-zoe-alarm.py --check-only

      - name: Кеш pip для telethon
        if: steps.check.outputs.needs_xlsx == 'true' && env.HAS_TG_SESSION == 'true'
        env:
          HAS_TG_SESSION: ${{ secrets.TELEGRAM_SESSION != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-telethon-ubuntu24-v1

      - name: Завантажити нові файли ЗМЕМ .xlsx та оновити воркер
        if: steps.check.outputs.needs_xlsx == 'true'
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          if [ -n "$TELEGRAM_SESSION" ]; then
            pip install --quiet telethon
          fi
          python3 cloudflare/scripts/sync-zoe-alarm.py
