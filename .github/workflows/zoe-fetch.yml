name: zoe-fetch

# «Очі» бота: раз на ~5 хвилин завантажує www.zoe.com.ua/outage/ через Tor
# з українським виходом (сайт відповідає лише українським мережам) і віддає
# готовий HTML у Cloudflare-воркер (POST /ingest), який робить дедуп і розсилку.
# Розклад часто запізнюється, тому основний режим — сторож у воркері, який
# будить цей workflow_dispatch вже при тиші > 3 хвилин.
#
# Потрібен секрет репозиторію INGEST_TOKEN (Settings → Secrets and variables → Actions).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zoe-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      WORKER_URL: "https://zoe-outage-bot.kir245314.workers.dev"
      SOURCE_URL: "https://www.zoe.com.ua/outage/"
      BROWSER_UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
    steps:
      # Кешуємо і guard-вузли/консенсус Tor, і самі .deb-пакети tor/tor-geoipdb,
      # щоб не залежати від нестабільного DNS security.ubuntu.com на кожному запуску.
      - name: Кеш tor-пакетів та даних
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/tor-data
            ${{ runner.temp }}/tor-debs
          key: tor-ua-ubuntu24-v2
          restore-keys: |
            tor-ua-ubuntu24-
            tor-data-ua-

      - name: Встановити tor
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          DEB_DIR="$RUNNER_TEMP/tor-debs"
          mkdir -p "$DEB_DIR"
          if ! command -v tor >/dev/null 2>&1 && ls "$DEB_DIR"/*.deb >/dev/null 2>&1; then
            echo "Встановлюємо tor із кешованих .deb пакетів..."
            sudo dpkg -i "$DEB_DIR"/*.deb || true
          fi
          if ! command -v tor >/dev/null 2>&1; then
            echo "Кешу .deb немає — завантажуємо через ізольований sources.list (mirrors.edge.kernel.org)..."
            CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")
            TOR_SOURCES="$RUNNER_TEMP/tor-sources.list"
            echo "deb https://mirrors.edge.kernel.org/ubuntu $CODENAME main universe" > "$TOR_SOURCES"
            APT_OPTS=(
              -o Dir::Etc::sourcelist="$TOR_SOURCES"
              -o Dir::Etc::sourceparts="-"
              -o APT::Get::List-Cleanup="0"
              -o Acquire::Retries=2
              -o Acquire::http::Timeout=10
              -o Acquire::https::Timeout=10
            )
            sudo apt-get "${APT_OPTS[@]}" update -qq
            sudo rm -f "$DEB_DIR"/*.deb
            sudo apt-get "${APT_OPTS[@]}" install -y -qq --no-install-recommends \
              -o Dir::Cache::Archives="$DEB_DIR" tor tor-geoipdb
            sudo chmod -R a+rX "$DEB_DIR" || true
          fi

      - name: Підняти tor з українським виходом
        run: |
          TOR_LOG="$RUNNER_TEMP/tor.log"
          TOR_DATA="$RUNNER_TEMP/tor-data"
          mkdir -p "$TOR_DATA"
          chmod 700 "$TOR_DATA"
          echo "вже запущені tor-процеси:"; pgrep -a tor || echo "немає"
          echo "зайняті порти 9050/19050:"; ss -ltn | grep -E "9050|19050" || echo "немає"
          # Порожній torrc замість системного /etc/tor/torrc; 19050 — свій порт,
          # бо 9050 у базовому образі раннера вже може бути зайнятий.
          TORRC_EMPTY="$RUNNER_TEMP/torrc-empty"
          : > "$TORRC_EMPTY"
          ARGS=(-f "$TORRC_EMPTY" --SocksPort 19050 --ExitNodes "{ua}" --StrictNodes 1 --DataDirectory "$TOR_DATA" --Log "notice file $TOR_LOG")
          if [ -f /usr/share/tor/geoip ]; then ARGS+=(--GeoIPFile /usr/share/tor/geoip); fi
          if [ -f /usr/share/tor/geoip6 ]; then ARGS+=(--GeoIPv6File /usr/share/tor/geoip6); fi
          tor "${ARGS[@]}" &
          # Іноді bootstrap через Tor із суворим українським виходом триває
          # довше двох хвилин (буває застрягає на 50%) — чекаємо до 5 хв.
          for i in $(seq 1 150); do
            if grep -q "Bootstrapped 100%" "$TOR_LOG" 2>/dev/null; then break; fi
            sleep 2
          done
          if ! grep -q "Bootstrapped 100%" "$TOR_LOG" 2>/dev/null; then
            echo "::error::tor не зміг піднятися"
            tail -n 40 "$TOR_LOG" || true
            exit 1
          fi

      - name: Завантажити сторінку через tor
        run: |
          PAGE_FILE="$RUNNER_TEMP/page.html"
          curl -sS -m 30 --socks5-hostname 127.0.0.1:19050 "https://api.ipify.org?format=json" > "$RUNNER_TEMP/exit-ip.json" 2>/dev/null || true
          echo "exit ip: $(cat "$RUNNER_TEMP/exit-ip.json" 2>/dev/null || echo '?')"
          ok=0
          for attempt in 1 2; do
            curl -sS -k -m 60 --socks5-hostname 127.0.0.1:19050 -A "$BROWSER_UA" \
              -o "$PAGE_FILE" -w "attempt=$attempt http=%{http_code} size=%{size_download} time=%{time_total}s\n" \
              "$SOURCE_URL" || true
            size=$(wc -c < "$PAGE_FILE" 2>/dev/null || echo 0)
            if [ "$size" -ge 20000 ]; then ok=1; break; fi
            sleep 8
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::не вдалося завантажити сторінку zoe через tor"
            exit 1
          fi

      - name: Віддати HTML у воркер
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          if [ -z "$INGEST_TOKEN" ]; then
            echo "::error::секрет INGEST_TOKEN не налаштований"
            exit 1
          fi
          curl -sS --fail-with-body -m 60 -X POST "$WORKER_URL/ingest" \
            -H "X-Ingest-Token: $INGEST_TOKEN" \
            -H "Content-Type: text/html; charset=utf-8" \
            --data-binary @"$RUNNER_TEMP/page.html" \
            -w "\nworker_http=%{http_code}\n"
