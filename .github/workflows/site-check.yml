name: site-check

on: workflow_dispatch

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch zoe.com.ua
        run: |
          echo "--- www https ---"
          curl -sS -o page.html -w "status=%{http_code} size=%{size_download} time=%{time_total}\n" --max-time 30 https://www.zoe.com.ua/outage/ || echo "curl failed with $?"
          echo "--- non-www https ---"
          curl -sS -o page2.html -w "status=%{http_code} size=%{size_download} time=%{time_total}\n" --max-time 20 https://zoe.com.ua/outage/ || echo "curl failed with $?"
          echo "--- page head ---"
          head -c 300 page.html || true
